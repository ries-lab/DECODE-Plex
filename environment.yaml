name: decode_plex

variables:
  # Some dependencies still import protobuf code generated by older protoc
  # versions. Keep the pure-Python protobuf parser enabled for compatibility.
  PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python

channels:
  - conda-forge
  - nvidia
  - pytorch
  - haydnspass/label/dev

dependencies:
  - python=3.10
  - pip

  # GPU runtime for DECODE-Plex. This works on Linux and Windows with a
  # compatible NVIDIA driver; no system CUDA toolkit installation is required.
  - pytorch=2.1.2
  - pytorch-cuda=12.1

  # DECODE runtime and notebooks.
  - click
  - deprecated
  - gitpython>=3.1
  - hydra-core=1.2
  - importlib_resources
  - ipykernel
  - jupyter_client
  - omegaconf=2.2
  - pydantic=1.10
  - pytest
  # hdfdict requires PyYAML < 6. Installing this with conda avoids a failing
  # PyYAML source build on Windows/Python 3.10 during the pip phase.
  - pyyaml=5.4.1
  - requests
  - pytorch-lightning=1.8.6
  - setuptools<81
  - structlog
  - tensorboard
  - tqdm

  # Required by DECODE's cubic-spline PSF simulation backend.
  - spline=0.11.1dev0

  - pip:
      # The conda spline package metadata pins an older numpy for solving.
      # Install the runtime scientific stack with pip afterwards, matching the
      # Linux-tested environment more closely.
      - numpy==1.26.4
      - scipy==1.15.3
      - pandas==2.3.3
      - h5py==3.15.1
      - matplotlib==3.8.4
      - scikit-image==0.24.0
      - scikit-learn==1.6.1
      - scikit-optimize==0.9.0
      - seaborn==0.12.2
      - statsmodels==0.14.2
      - tifffile==2025.5.10
      - imageio==2.37.0
      - pillow==12.0.0
      - pywavelets==1.6.0

      # uiPSF and figure-reproduction helpers.
      - czifile
      - dotted-dict
      - hdfdict
      - mat73
      - opencv-python-headless
      - nvidia-cuda-runtime-cu11==11.8.89
      - tensorboardX
      - tensorflow==2.20.0
      - tensorflow-probability==0.25.0
      - tf-keras==2.20.1
      - torchmetrics==0.11.0
      - xarray
      - zernike
